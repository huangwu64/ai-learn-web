server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: prompt-training-server
  security:
    filter:
      # 只对 REQUEST/ERROR 派发做鉴权，跳过 ASYNC（避免 SSE 流式完成时的异步派发重复鉴权报错）
      dispatcher-types: request, error

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      # 逻辑删除字段名
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# Knife4j API 文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# ============================================================
# 管理员配置（V3 新增）
# 账号和密码可在配置文件中修改，请勿在代码中硬编码
# 密码支持：明文 或 BCrypt 哈希（以 $2a$/$2b$ 开头）
# ============================================================
admin:
  # 管理员账号
  username: admin
  # 管理员密码（默认 123456，请及时修改）
  password: "123456"
  # 管理员前端入口路径（可配置替换的特殊 URL）
  entry-path: /admin
  # 管理员 Token 有效期（秒），默认 12 小时
  token-expiration: 43200

# ============================================================
# 云服务器部署配置（V4 预留，本版本不填写）
# 下版本迁移云服务器时将在下方补充：服务器 IP、域名、HTTPS、
# 远程数据库、文件存储、CORS 白名单等
# ============================================================
